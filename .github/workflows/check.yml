name: Check Galaxy Tanta What's On

on:
  workflow_dispatch:
  schedule:
    # Egypt is UTC+3 (9:00 AM = 06:00 UTC, 6:00 PM = 15:00 UTC — 2hr buffer before 11am/8pm targets)
    # 3 = Wednesday, 4 = Thursday
    - cron: "0 6,15 * * 3,4"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Galaxy Tanta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_INITIAL_SNAPSHOT: "true"
        run: python monitor.py

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change."
          else
            git config user.name "galaxy-tanta-monitor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update What's On snapshot"
            git push
          fi
